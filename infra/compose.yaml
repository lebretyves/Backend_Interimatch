name: infimatch
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: infimatch
      POSTGRES_USER: infimatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    ports: ["127.0.0.1:55432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infimatch -d infimatch"]
      interval: 3s
      timeout: 3s
      retries: 30
  mongo:
    image: mongo:8.0.5
    environment:
      MONGO_INITDB_ROOT_USERNAME: infimatch
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?required}
    ports: ["127.0.0.1:57017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 30
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.114.4
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?required}
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      N8N_SECURE_COOKIE: "false"
    ports: ["127.0.0.1:55678:5678"]
    volumes: [n8n-data:/home/node/.n8n]
    profiles: [automation]
volumes:
  postgres-data:
  mongo-data:
  n8n-data:
